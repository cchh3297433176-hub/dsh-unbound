# dsh-unbound 的行配置。文风与开关的真值在 $DSH_HOME/unbound/ 下，
# 这里只给首次运行时的默认值。
- insert:
    - id: unbound
      name: dsh-unbound
      config:
        # 首次运行（还没有 state.json）时是否开启成人对话模式。
        enabled: true
        # 旧配置项：首次运行时是否默认选用 anti-cliche 文风；false 则不给文风。
        antiCliche: true
        # 可选的附加要求，追加在文风后面；不会覆盖内置合同。
        extraInstructions: ""
